name: Test prediction

# Start a short test prediction on the latest version, or follow one that's already
# running (pass its id) without starting a new paid run.

on:
  workflow_dispatch:
    inputs:
      prediction_id:
        description: "Follow this existing prediction instead of starting one (optional)"
        required: false
        default: ""
      model_name:
        description: 'Replicate model: "name" (owner = the account of the token) or "owner/name"'
        required: true
        default: "synthesys-ai/longcat-video-avatar-1.6"
      seconds:
        description: "Test length in seconds (max_duration; the demo speech is 82 s long)"
        required: false
        default: "8"
      sparse_attention:
        description: "sparse_attention input (empty = the model's default)"
        required: false
        default: ""
      version:
        description: "Run this exact version id (empty = the model's latest)"
        required: false
        default: ""
      extra_input:
        description: 'Extra inputs as JSON, e.g. {"sage_attention": true}'
        required: false
        default: "{}"

jobs:
  smoke:
    name: Test prediction
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run or follow the prediction
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          NAME: ${{ inputs.model_name }}
          PREDICTION_ID: ${{ inputs.prediction_id }}
          SMOKE_SECONDS: ${{ inputs.seconds }}
          SMOKE_SPARSITY: ${{ inputs.sparse_attention }}
          VERSION: ${{ inputs.version }}
          SMOKE_INPUT: ${{ inputs.extra_input }}
          WAIT_MINUTES: "70"
        run: |
          set -euo pipefail
          case "$NAME" in
            */*) MODEL="$NAME" ;;
            *) MODEL="$(curl --retry 5 --retry-all-errors --retry-delay 5 -sf -H "Authorization: Bearer ${REPLICATE_API_TOKEN}" https://api.replicate.com/v1/account | jq -r .username)/$NAME" ;;
          esac
          export MODEL
          scripts/smoke.sh "$PREDICTION_ID"
