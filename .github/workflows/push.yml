name: Push to Replicate

# Builds the Cog image on a GitHub runner (no local Docker needed), creates the model
# on Replicate as PUBLIC if it doesn't exist yet, pushes a new version, and can run a
# short test prediction against it.
#
# Needs two repository secrets:
#   REPLICATE_API_TOKEN       replicate.com/account/api-tokens  (API calls: create model, test run)
#   REPLICATE_CLI_AUTH_TOKEN  replicate.com/auth/token          (cog login; Cog rejects API tokens)

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Replicate model: "name" (owner = the account of the token) or "owner/name"'
        required: true
        default: "synthesys-ai/longcat-video-avatar-1.6"
      hardware:
        description: "GPU for the model (only used when the model is first created)"
        required: true
        default: "gpu-h100"
      smoke_test:
        description: "Run a test prediction after pushing"
        type: boolean
        default: true
      smoke_seconds:
        description: "Test length in seconds (max_duration; the demo speech is 82 s long)"
        required: false
        default: "8"

jobs:
  push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/julia* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the model name
        id: model
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MODEL: ${{ inputs.model_name }}
        run: |
          set -euo pipefail
          if [ -z "${REPLICATE_API_TOKEN}" ]; then echo "Missing repository secret REPLICATE_API_TOKEN"; exit 1; fi
          case "$MODEL" in
            */*) full="$MODEL" ;;
            *) owner=$(curl --retry 5 --retry-all-errors --retry-delay 5 -sf -H "Authorization: Bearer ${REPLICATE_API_TOKEN}" https://api.replicate.com/v1/account | jq -r .username)
               full="${owner}/${MODEL}" ;;
          esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Model: $full"

      - name: Create the model on Replicate (public) if missing
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MODEL: ${{ steps.model.outputs.full }}
          HARDWARE: ${{ inputs.hardware }}
        run: |
          set -euo pipefail
          owner="${MODEL%%/*}"; name="${MODEL##*/}"
          auth="Authorization: Bearer ${REPLICATE_API_TOKEN}"
          code=$(curl --retry 5 --retry-all-errors --retry-delay 5 -s -o model.json -w '%{http_code}' -H "$auth" "https://api.replicate.com/v1/models/${owner}/${name}")
          if [ "$code" = "200" ]; then
            echo "Model already exists:"; jq '{url, visibility}' model.json; exit 0
          fi
          body=$(jq -n --arg owner "$owner" --arg name "$name" --arg hw "$HARDWARE" '{
            owner: $owner, name: $name, visibility: "public", hardware: $hw,
            description: "LongCat-Video-Avatar 1.6 by Meituan: audio-driven talking avatar video from speech plus an image or a text prompt, with long-form continuation.",
            github_url: "https://github.com/Synthesys-AI/longcat-video-avatar-replicate",
            paper_url: "https://github.com/meituan-longcat/LongCat-Video/blob/main/assets/LongCat-Video-Avatar-1.6-Tech-Report.pdf",
            license_url: "https://huggingface.co/meituan-longcat/LongCat-Video-Avatar-1.6"
          }')
          code=$(curl --retry 5 --retry-all-errors --retry-delay 5 -s -o created.json -w '%{http_code}' -X POST -H "$auth" -H "Content-Type: application/json" \
            -d "$body" https://api.replicate.com/v1/models)
          if [ "$code" != "201" ] && [ "$code" != "200" ]; then
            echo "Creating the model failed (HTTP $code):"; cat created.json; echo
            echo "Hardware SKUs this account can use:"
            curl --retry 5 --retry-all-errors --retry-delay 5 -s -H "$auth" https://api.replicate.com/v1/hardware | jq -r '.[] | "\(.sku)\t\(.name)"'
            exit 1
          fi
          echo "Created:"; jq '{url, visibility}' created.json

      # replicate/setup-cog was removed from GitHub, so install a pinned Cog release directly.
      # `cog login` = POST r8.im/cog/v1/verify-token (-> username) + `docker login r8.im`,
      # but it refuses any token starting with r8_ before asking Replicate. We do the same
      # two steps ourselves and let Replicate's verify endpoint decide.
      - name: Install Cog and log in to Replicate
        env:
          COG_VERSION: v0.23.1
          CLI_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
          API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/cog \
            "https://github.com/replicate/cog/releases/download/${COG_VERSION}/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
          cog --version
          docker version --format 'docker {{.Server.Version}}'

          describe() { case "$1" in r8_*) echo "API-style (r8_), ${#1} chars" ;; "") echo "empty" ;; *) echo "CLI-style, ${#1} chars" ;; esac; }
          echo "REPLICATE_CLI_AUTH_TOKEN: $(describe "${CLI_TOKEN}")"
          [ -n "${CLI_TOKEN}" ] && [ "${CLI_TOKEN}" = "${API_TOKEN}" ] && echo "NOTE: REPLICATE_CLI_AUTH_TOKEN is identical to REPLICATE_API_TOKEN"

          login_with() {
            local token="$1" code user
            code=$(curl --retry 5 --retry-all-errors --retry-delay 5 -s -o verify.json -w '%{http_code}' -X POST --data-urlencode "token=${token}" https://r8.im/cog/v1/verify-token)
            if [ "$code" != "200" ]; then echo "  r8.im verify-token: HTTP $code"; return 1; fi
            user=$(jq -r .username verify.json); rm -f verify.json
            printf '%s' "$token" | docker login r8.im --username "$user" --password-stdin >/dev/null
            echo "Logged in to r8.im as $user"
          }
          for t in "${CLI_TOKEN}" "${API_TOKEN}"; do
            [ -n "$t" ] || continue
            if login_with "$t"; then exit 0; fi
          done
          echo "Replicate rejected both tokens for pushing. Copy the token shown at https://replicate.com/auth/token"
          echo "(signed in as the synthesys-ai account) into the REPLICATE_CLI_AUTH_TOKEN secret."
          exit 1

      - name: Push to Replicate
        run: |
          # r8.im sometimes answers a big layer upload with a 502. Pushing again on the same
          # runner reuses the build cache and skips the layers the registry already has.
          for attempt in 1 2 3; do
            if cog push "r8.im/${{ steps.model.outputs.full }}"; then exit 0; fi
            echo "::warning::cog push attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Read the new version id
        id: version
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          set -euo pipefail
          v=$(curl --retry 5 --retry-all-errors --retry-delay 5 -sf -H "Authorization: Bearer ${REPLICATE_API_TOKEN}" \
            "https://api.replicate.com/v1/models/${{ steps.model.outputs.full }}" | jq -r '.latest_version.id')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Pushed version $v"

  smoke:
    name: Test prediction
    needs: push
    if: ${{ inputs.smoke_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run an image+speech test prediction
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          VERSION: ${{ needs.push.outputs.version }}
          SMOKE_SECONDS: ${{ inputs.smoke_seconds }}
          WAIT_MINUTES: "70"
        run: scripts/smoke.sh
