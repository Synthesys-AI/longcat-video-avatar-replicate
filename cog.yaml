# Cog package for meituan-longcat/LongCat-Video-Avatar-1.6 (MIT).
# Weights are NOT baked into the image: setup() downloads the pinned Hugging Face
# revisions (~63 GB) on first boot of each machine. See predict.py.
# Written for Cog v0.23 (BaseRunner / run()).
build:
  gpu: true
  cuda: "12.8"
  python_version: "3.10"
  system_packages:
    - ffmpeg
    - libsndfile1
    - git
    # Triton builds its kernel launcher with a C compiler (sparse attention's kernels).
    - build-essential
  python_requirements: requirements.txt
  run:
    # FlashAttention 3: the prebuilt build for this torch from Hugging Face's kernel hub, copied
    # into the image so boots don't depend on that repo (its card says the old "model"-type
    # kernel repos are being removed). Only the .so that _ops.py loads; works with both the
    # old (build/<variant>/flash_attn3/) and new (build/<variant>/) layouts. Keep the revision in
    # sync with FA3_KERNEL_REVISION in predict.py. If this fails, startup downloads it instead.
    - >-
      python -c "import re, glob, torch, huggingface_hub as hub;
      major, minor = torch.__version__.split('+')[0].split('.')[:2];
      abi = 'cxx11' if torch._C._GLIBCXX_USE_CXX11_ABI else 'cxx98';
      cu = torch.version.cuda.replace('.', '');
      rel = f'build/torch{major}{minor}-{abi}-cu{cu}-x86_64-linux';
      kw = dict(repo_id='kernels-community/flash-attn3', revision='e29f138fc363b396e5d2706c8a5f6fa7d36f41e0', local_dir='/opt/flash-attn3');
      hub.snapshot_download(allow_patterns=[rel + '/*.py', rel + '/*.json'], **kw);
      ops = sorted(glob.glob('/opt/flash-attn3/' + rel + '/_ops.py') + glob.glob('/opt/flash-attn3/' + rel + '/*/_ops.py'))[0];
      lib = re.search(r'from \. import (_flash_attn3_\w+)', open(ops).read()).group(1);
      pkg = ops.rsplit('/', 1)[0][len('/opt/flash-attn3/'):];
      hub.snapshot_download(allow_patterns=[pkg + '/' + lib + '*.so'], **kw);
      print('FA3 kernel copied into the image:', pkg, lib)"
      || echo "FA3 kernel NOT copied into the image; predict.py will download it at startup"
    # SageAttention (8-bit attention, `sage_attention` input): the prebuilt build for this torch
    # from the same hub, copied in the same way. Keep the revision in sync with
    # SAGE_KERNEL_REVISION in predict.py.
    - >-
      python -c "import torch, huggingface_hub as hub;
      major, minor = torch.__version__.split('+')[0].split('.')[:2];
      abi = 'cxx11' if torch._C._GLIBCXX_USE_CXX11_ABI else 'cxx98';
      cu = torch.version.cuda.replace('.', '');
      variant = f'torch{major}{minor}-{abi}-cu{cu}-x86_64-linux';
      hub.snapshot_download(repo_id='kernels-community/sage-attention', revision='f81ef5e170c530160930bbb3394df612800e98e7', local_dir='/opt/sage-attention', allow_patterns=[f'build/{variant}/*']);
      print('SageAttention kernel copied into the image:', variant)"
      || echo "SageAttention kernel NOT copied into the image; predict.py will download it at startup"
    # FA2 below is the fallback if FA3 fails its self-test.
    # Prebuilt FlashAttention-2 for torch 2.8 / CUDA 12 / py3.10 (PyPI torch 2.8 uses the new C++ ABI).
    - pip install --no-deps "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp310-cp310-linux_x86_64.whl"
    # Meituan's inference code, pinned to the commit this predictor was written against.
    - git clone https://github.com/meituan-longcat/LongCat-Video /opt/LongCat-Video && cd /opt/LongCat-Video && git checkout 58eb336edc5c8c63389838727e40b8c18434e54e && rm -rf .git
run: "predict.py:Runner"
